# 定时任务清单 —— 改完执行 `sh scripts/cron/install.sh` 生效。
#
# 每行一个任务，三段用 | 分隔，两侧空白忽略：
#
#     名称 | cron 表达式 [+秒偏移] | 命令
#
# 名称        只写进 crontab 注释，方便 `crontab -l` 辨认。
# cron 表达式 标准 5 字段，或 @daily / @hourly 这类快捷写法。
#             末尾可跟 `+秒,秒`：为每个偏移各生成一条 `sleep N && ...`，
#             用来做子分钟调度（cron 本身最细只到分钟）。
# 命令        在项目根目录下执行，标准输出与错误都追加到日志文件，路径在安装时固化进 crontab 记录。
#             第三段之后的内容整体作为命令，里面可以有 | 和 &&。
#
# `#` 开头的行与空行忽略。
#
# 示例（照抄前先删掉行首的 #）：
#
# 同步数据      | */5 * * * *          | node dist/scripts/sync.js
# 高频巡检      | * * * * * +0,20,40   | node dist/scripts/poll.js
# 每日备份      | 0 3 * * *            | ./scripts/backup.sh --retention 7
# 健康检查上报  | */30 * * * *         | curl -fsS --max-time 10 https://hc-ping.com/<uuid>
