# 定时任务清单 —— 改完执行同目录下的 install.sh 生效。
#
# 装的是当前用户的 LaunchAgent（不是 cron）：cron 的进程不在 GUI 会话里，读不到 login keychain，
# 要登录态的命令行工具一律报未登录，headful 的浏览器也起不来；LaunchAgent 跑在 gui/<uid> 域里才成立。
# 代价是它跟着登录会话：注销或关机期间不跑，重新登录后自动加载。
#
# 每行一个任务，三段用 | 分隔，两侧空白忽略：
#
#     名称 | cron 表达式 [+秒偏移] | 命令
#
# 名称        只写进 plist 注释，并折算成标签里的 slug（只留小写字母与数字，其余折成 `-`；
#             中文名折不出字符时记成 task，靠标签里的序号区分），方便辨认。
# cron 表达式 标准 5 字段，或 @hourly / @daily / @weekly / @monthly / @yearly / @reboot。
#             字段支持 n、a-b、*/n、a-b/n 与逗号列表。
#             `*/N * * * *` 装成 StartInterval（机器睡醒后会立刻补跑一次，轮询型任务要的是这个），
#             其余装成 StartCalendarInterval。
#             日和星期不能同时限定——cron 按「或」算而 launchd 按「与」算，要就拆成两条任务。
#             末尾可跟 `+秒,秒`：为每个偏移各生成一个 `sleep N && ...` 的 plist，
#             用来做子分钟调度（launchd 本身最细也只到分钟）。
# 命令        在项目根目录下执行（plist 的 WorkingDirectory），标准输出与错误都追加到日志文件，
#             日志路径在安装时固化进 plist 里的命令。
#             第三段之后的内容整体作为命令，里面可以有 | 和 &&。
#             plist 里的 PATH 是执行 install.sh 时的 PATH。解释器由版本管理器按会话注入 PATH 时
#             （fnm、nvm 的 shell 集成等），命令里写解释器的绝对路径——会话级的临时目录在会话结束后就消失。
#
# `#` 开头的行与空行忽略。
#
# 示例（照抄前先删掉行首的 #）：
#
# 同步数据      | */5 * * * *          | node dist/scripts/sync.js
# 高频巡检      | * * * * * +0,20,40   | node dist/scripts/poll.js
# 每日备份      | 0 3 * * *            | ./scripts/backup.sh --retention 7
# 健康检查上报  | */30 * * * *         | curl -fsS --max-time 10 https://hc-ping.com/<uuid>
#
# ---- 本项目的任务写在这一行之后 ----
